[package]
name = "mimo-opt"
version = "1.0.0"
edition = "2021"
description = "MiMo-OPT: 多 Provider AI 聊天工具"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
futures-util = "0.3"
dirs = "6"
anyhow = "1"
scopeguard = "1"
unicode-width = "0.2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
arboard = "3"
log = "0.4"
env_logger = "0.11"
tauri = { version = "1", features = ["shell-open", "dialog-save"] }

[build-dependencies]
tauri-build = { version = "1" }

[[bin]]
name = "mimo-opt"
path = "src/main.rs"

[[bin]]
name = "mimo-opt-desktop"
path = "src/desktop.rs"
