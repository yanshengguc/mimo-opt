[package]
name = "mimo-opt"
version = "0.1.0"
edition = "2021"
description = "MiMo-OPT: 小米 MiMo API 终端聊天工具"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ratatui = "0.29"
crossterm = "0.28"
futures-util = "0.3"
dirs = "6"
anyhow = "1"
scopeguard = "1"
unicode-width = "0.2"
